name: Promote Security Release to Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact Git SHA already accepted in staging
        required: true
        type: string
      staging_run_id:
        description: Successful staging workflow run containing the attested bundle
        required: true
        type: string
      expected_bundle_sha256:
        description: SHA-256 emitted by the staging workflow
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: threatforge-production
  cancel-in-progress: false

jobs:
  gate:
    name: Verify Staging Evidence
    runs-on: ubuntu-latest
    environment: production
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Require an immutable main-branch revision
        id: validate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: hf-model-bundle
          path: staged-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.staging_run_id }}
      - name: Verify the exact staged bundle
        env:
          EXPECTED_BUNDLE_SHA256: ${{ inputs.expected_bundle_sha256 }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          cd staged-artifact
          echo "$EXPECTED_BUNDLE_SHA256  hf-model-bundle.tar.gz" | sha256sum --check -
          echo "$EXPECTED_BUNDLE_SHA256  hf-model-bundle.tar.gz" > hf-model-bundle.sha256
          mkdir inspected
          tar -xzf hf-model-bundle.tar.gz -C inspected
          test "$(jq -r .repository_commit inspected/release-manifest.json)" = "$RELEASE_SHA"

  deploy-ml:
    name: Deploy Exact ML Bundle to Hugging Face
    runs-on: ubuntu-latest
    needs: gate
    environment: production
    outputs:
      hf_commit: ${{ steps.push.outputs.hf_commit }}
      previous_hf_commit: ${{ steps.push.outputs.previous_hf_commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hf-model-bundle
          path: staged-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.staging_run_id }}
      - name: Re-verify staged bundle digest
        env:
          EXPECTED_BUNDLE_SHA256: ${{ inputs.expected_bundle_sha256 }}
        run: |
          echo "$EXPECTED_BUNDLE_SHA256  staged-artifact/hf-model-bundle.tar.gz" | sha256sum --check -
          mkdir release
          tar -xzf staged-artifact/hf-model-bundle.tar.gz -C release
      - name: Push unchanged directory to production Space
        id: push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
        run: |
          git clone "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_NAME}" hf-space
          cd hf-space
          echo "previous_hf_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          rsync -a --delete --exclude='.git' ../release/ ./
          git config user.email "deploy@threatforge.dev"
          git config user.name "ThreatForge Deploy"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Release ${RELEASE_SHA}"
            git push origin main
          fi
          echo "hf_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for verified model readiness
        env:
          HF_PRODUCTION_URL: ${{ secrets.HF_PRODUCTION_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$HF_PRODUCTION_URL/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  deploy-backend:
    name: Deploy Exact Backend Revision to Render
    runs-on: ubuntu-latest
    needs: [gate, deploy-ml]
    environment: production
    outputs:
      render_deploy_id: ${{ steps.deploy.outputs.render_deploy_id }}
      previous_render_deploy_id: ${{ steps.deploy.outputs.previous_render_deploy_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - name: Deploy and wait for Render terminal state
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          deploy_output="$(python .github/scripts/deploy_render.py \
            --service-id "${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}" \
            --commit-sha "${{ needs.gate.outputs.release_sha }}")"
          echo "$deploy_output"
          render_deploy_id="$(echo "$deploy_output" | sed -n 's/^render_deploy_id=\([^ ]*\).*/\1/p' | tail -1)"
          previous_render_deploy_id="$(echo "$deploy_output" | sed -n 's/^previous_render_deploy_id=\([^ ]*\).*/\1/p' | tail -1)"
          test -n "$render_deploy_id"
          echo "render_deploy_id=$render_deploy_id" >> "$GITHUB_OUTPUT"
          echo "previous_render_deploy_id=$previous_render_deploy_id" >> "$GITHUB_OUTPUT"
      - name: Verify direct Render readiness
        env:
          RENDER_PRODUCTION_URL: ${{ secrets.RENDER_PRODUCTION_URL }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            "$RENDER_PRODUCTION_URL/api/health/ready" > /dev/null

  deploy-frontend:
    name: Deploy Exact Frontend Revision to Vercel
    runs-on: ubuntu-latest
    needs: [gate, deploy-backend]
    environment: production
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      previous_vercel_deployment_id: ${{ steps.previous.outputs.previous_vercel_deployment_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "${{ secrets.VERCEL_ORG_ID }}" \
            "${{ secrets.VERCEL_PROJECT_ID }}" > .vercel/project.json
      - run: npm install --global vercel@56.5.0
      - name: Record current production deployment
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=1")"
          previous_id="$(echo "$response" | jq -r '.deployments[0].uid // empty')"
          test -n "$previous_id"
          echo "previous_vercel_deployment_id=$previous_id" >> "$GITHUB_OUTPUT"
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Promote prebuilt output
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

  verify-release:
    name: Production Gates and One-Hour Observation
    runs-on: ubuntu-latest
    needs: [gate, deploy-ml, deploy-backend, deploy-frontend]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - name: Initial direct and proxied readiness gates
        env:
          RENDER_PRODUCTION_URL: ${{ secrets.RENDER_PRODUCTION_URL }}
          VERCEL_DEPLOYMENT_URL: ${{ needs.deploy-frontend.outputs.deployment_url }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            "$RENDER_PRODUCTION_URL/api/health/ready" > /dev/null
          curl --fail --silent --show-error --max-time 15 \
            -H "x-vercel-protection-bypass: $VERCEL_BYPASS_TOKEN" \
            "$VERCEL_DEPLOYMENT_URL/api/proxy/health" > /dev/null
      - name: Authenticated core smoke with exact cleanup
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.PRODUCTION_SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_TEST_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python .github/scripts/smoke_release.py \
            --base-url "${{ needs.deploy-frontend.outputs.deployment_url }}" \
            --include-scan
      - name: Fifteen-minute gate and one-hour observation
        env:
          RENDER_PRODUCTION_URL: ${{ secrets.RENDER_PRODUCTION_URL }}
          VERCEL_DEPLOYMENT_URL: ${{ needs.deploy-frontend.outputs.deployment_url }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          check_health() {
            curl --fail --silent --show-error --max-time 10 \
              "$RENDER_PRODUCTION_URL/api/health/ready" > /dev/null
            curl --fail --silent --show-error --max-time 15 \
              -H "x-vercel-protection-bypass: $VERCEL_BYPASS_TOKEN" \
              "$VERCEL_DEPLOYMENT_URL/api/proxy/health" > /dev/null
          }
          for check in $(seq 1 5); do
            check_health
            if [ "$check" -lt 5 ]; then sleep 225; fi
          done
          for check in $(seq 1 9); do
            sleep 300
            check_health
          done
      - name: Record release evidence
        run: |
          {
            echo "### ThreatForge production security release"
            echo "- Git SHA: ${{ needs.gate.outputs.release_sha }}"
            echo "- Model bundle SHA-256: ${{ inputs.expected_bundle_sha256 }}"
            echo "- Hugging Face commit: ${{ needs.deploy-ml.outputs.hf_commit }}"
            echo "- Previous Hugging Face commit: ${{ needs.deploy-ml.outputs.previous_hf_commit }}"
            echo "- Render deployment: ${{ needs.deploy-backend.outputs.render_deploy_id }}"
            echo "- Previous Render deployment: ${{ needs.deploy-backend.outputs.previous_render_deploy_id }}"
            echo "- Vercel deployment: ${{ needs.deploy-frontend.outputs.deployment_url }}"
            echo "- Previous Vercel deployment: ${{ needs.deploy-frontend.outputs.previous_vercel_deployment_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback-production:
    name: Roll Back Failed Production Promotion
    runs-on: ubuntu-latest
    needs: [gate, deploy-ml, deploy-backend, deploy-frontend, verify-release]
    if: >-
      ${{
        always()
        && needs.gate.result == 'success'
        && (
          needs.deploy-ml.result == 'failure'
          || needs.deploy-backend.result == 'failure'
          || needs.deploy-frontend.result == 'failure'
          || needs.verify-release.result == 'failure'
        )
      }}
    environment: production
    steps:
      - name: Roll back Vercel when a prior deployment was recorded
        if: ${{ needs.deploy-frontend.outputs.previous_vercel_deployment_id != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS_VERCEL_DEPLOYMENT_ID: ${{ needs.deploy-frontend.outputs.previous_vercel_deployment_id }}
        run: |
          npm install --global vercel@56.5.0
          vercel rollback "$PREVIOUS_VERCEL_DEPLOYMENT_ID" \
            --yes --token="$VERCEL_TOKEN"
      - name: Roll back Render when a prior deployment was recorded
        if: ${{ needs.deploy-backend.outputs.previous_render_deploy_id != '' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          PREVIOUS_RENDER_DEPLOYMENT_ID: ${{ needs.deploy-backend.outputs.previous_render_deploy_id }}
        run: |
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$PREVIOUS_RENDER_DEPLOYMENT_ID/rollback" \
            > /dev/null
      - name: Roll back Hugging Face source tree when a prior commit was recorded
        if: ${{ needs.deploy-ml.outputs.previous_hf_commit != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
          PREVIOUS_HF_COMMIT: ${{ needs.deploy-ml.outputs.previous_hf_commit }}
        run: |
          git clone "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_NAME}" hf-space
          cd hf-space
          git config user.email "deploy@threatforge.dev"
          git config user.name "ThreatForge Deploy"
          git read-tree --reset -u "$PREVIOUS_HF_COMMIT"
          if ! git diff --cached --quiet; then
            git commit -m "Rollback failed ThreatForge security release"
            git push origin main
          fi
